<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Logging Tool — API Gateway</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .tool-shell { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding: 28px 20px 48px; }
    .tool-topbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }
  </style>
</head>
<body>
  <div class="bg-animation"><div class="orb"></div><div class="orb"></div><div class="orb"></div></div>

  <main class="tool-shell">
    <header class="page-header">
      <h2>
        <span class="ph-icon">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        </span>
        Logging Tool
      </h2>
      <p>Kirim log custom ke endpoint integrator logging untuk kebutuhan pengujian.</p>
    </header>

    <div class="tool-topbar">
      <a class="btn btn-outline" href="/" id="nav_back">
        <svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Kembali ke Beranda
      </a>
      <a class="btn btn-outline" href="/monitor">
        <svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        Monitor
      </a>
    </div>

    <section class="glass-card">
      <div class="card-header">
        <div class="card-title">
          <span class="card-icon">
            <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </span>
          Send Log
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="user_id">User ID</label>
          <input class="form-input" id="user_id" value="tester" />
        </div>
        <div class="form-group">
          <label class="form-label" for="endpoint">Endpoint Dicatat</label>
          <input class="form-input" id="endpoint" value="/custom/test" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="extra">Info Tambahan (JSON object)</label>
        <textarea class="form-input" id="extra" rows="5">{"info":"uji logging dari UI","source":"logging.html"}</textarea>
      </div>

      <button class="btn btn-primary" id="btn_send">
        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        Kirim Log
      </button>

      <div class="response-panel" style="margin-top: 18px;">
        <div class="response-header">
          <div class="response-status" id="status_line">
            <span class="status-pill"></span>
            Response
          </div>
        </div>
        <div class="response-body" id="resp">-</div>
      </div>
    </section>
  </main>

  <script src="/static/tool_common.js"></script>
  <script>
    const SVG_OK   = '<span class="status-pill" style="background:var(--accent-emerald);"></span>';
    const SVG_ERR  = '<span class="status-pill" style="background:var(--accent-rose);"></span>';
    const SVG_PEND = '<span class="status-pill" style="background:var(--accent-amber);"></span>';

    configureBackLink('nav_back');
    const resp       = document.getElementById('resp');
    const statusLine = document.getElementById('status_line');

    function setState(type, text) {
      const dot = type === 'success' ? SVG_OK : type === 'error' ? SVG_ERR : SVG_PEND;
      statusLine.className = 'response-status ' + type;
      statusLine.innerHTML = dot + ' ' + text;
    }

    document.getElementById('btn_send').addEventListener('click', async () => {
      let extra = {};
      try {
        extra = JSON.parse(document.getElementById('extra').value || '{}');
      } catch (e) {
        setState('error', 'JSON tambahan tidak valid');
        resp.textContent = 'Error: JSON tambahan tidak valid';
        return;
      }

      const payload = {
        user_id: document.getElementById('user_id').value.trim(),
        parameter: { endpoint: document.getElementById('endpoint').value.trim(), ...extra }
      };

      setState('pending', 'Sending...');
      resp.textContent = 'Loading...';
      try {
        const r    = await fetch('/integrator/logging', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        const data = await r.json();
        resp.textContent = JSON.stringify(data, null, 2);
        if (data.status === 'sukses') setState('success', 'Log berhasil dikirim');
        else setState('error', 'Log gagal dikirim');
      } catch (e) { setState('error', 'Error koneksi'); resp.textContent = 'Error: ' + e; }
    });
  </script>
</body>
</html>
