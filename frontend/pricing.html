<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pricing Plans - API Gateway</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .tool-shell { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 28px 20px 48px; }
    .tool-topbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    .plans-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
    .plan-card { background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: var(--radius-lg); padding: 18px; }
    .plan-name { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .plan-price { font-size: 24px; font-weight: 700; color: var(--accent-cyan); margin-bottom: 10px; }
    .plan-line { font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
    .badge { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 3px 8px; background: rgba(59,130,246,0.15); color: var(--accent-blue); }
  </style>
</head>
<body>
  <div class="bg-animation"><div class="orb"></div><div class="orb"></div><div class="orb"></div></div>
  <main class="tool-shell">
    <header class="page-header">
      <h2>📦 Pricing Plans</h2>
      <p>Lihat daftar paket langganan gateway dan fitur aksesnya.</p>
    </header>
    <div class="tool-topbar">
      <a class="btn btn-outline" href="/" id="nav_back">🏠 Kembali ke Beranda</a>
      <a class="btn btn-outline" href="/apps/manage">🧩 Apps</a>
      <a class="btn btn-outline" href="/integrator/manage/routing">🔀 Routing</a>
    </div>

    <section class="glass-card">
      <div class="card-header">
        <div class="card-title"><span class="icon">📋</span> Daftar Paket</div>
        <button class="btn btn-primary" id="btn_load">🔄 Refresh</button>
      </div>
      <div class="plans-grid" id="plans_grid"></div>
    </section>

    <section class="glass-card">
      <div class="card-header"><div class="card-title"><span class="icon">🧪</span> Raw Response</div></div>
      <div class="response-panel"><div class="response-body" id="raw">-</div></div>
    </section>
  </main>

  <script src="/static/tool_common.js"></script>
  <script>
    configureBackLink('nav_back')
    const grid = document.getElementById('plans_grid')
    const raw = document.getElementById('raw')

    function boolLabel(v) { return v ? 'Yes' : 'No' }

    async function loadPlans() {
      raw.textContent = 'Loading...'
      grid.innerHTML = ''
      try {
        const res = await fetch('/paket/list')
        const data = await res.json()
        raw.textContent = JSON.stringify(data, null, 2)
        const plans = (data && data.data) || []
        if (!plans.length) {
          grid.innerHTML = '<div class="plan-card"><div class="plan-line">Belum ada data paket.</div></div>'
          return
        }
        plans.forEach((p) => {
          const el = document.createElement('div')
          el.className = 'plan-card'
          el.innerHTML = `
            <div class="plan-name">${p.nama_paket}</div>
            <div class="plan-price">Rp ${Number(p.harga_per_bulan).toLocaleString('id-ID')}/bln</div>
            <div class="plan-line"><span class="badge">Quota</span> ${p.quota_label || p.quota_per_bulan}</div>
            <div class="plan-line">Fee: ${p.fee_transaksi_persen}%</div>
            <div class="plan-line">Routing: ${boolLabel(p.akses_routing)}</div>
            <div class="plan-line">Monitor: ${boolLabel(p.akses_monitor)}</div>
            <div class="plan-line">Validasi: ${boolLabel(p.akses_validasi)}</div>
          `
          grid.appendChild(el)
        })
      } catch (e) {
        raw.textContent = 'Error: ' + e
      }
    }

    document.getElementById('btn_load').addEventListener('click', loadPlans)
    loadPlans()
  </script>
</body>
</html>
