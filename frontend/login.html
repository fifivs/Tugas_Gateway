<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login ke Dashboard API Gateway">
  <title>Login — API Gateway</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/landing.css">
</head>

<body>
  <div class="bg-animation">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <div class="brand-icon brand-icon-lg">⚡</div>
        <h1 class="login-title">API Gateway</h1>
        <p class="login-subtitle">Masuk ke dashboard untuk mengelola transaksi</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="loginUsername">USERNAME</label>
          <div class="input-icon-wrap">
            <span class="input-icon">👤</span>
            <input type="text" class="form-input form-input-icon" id="loginUsername" placeholder="Masukkan username"
              required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="loginPassword">PASSWORD</label>
          <div class="input-icon-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" class="form-input form-input-icon" id="loginPassword" placeholder="Masukkan password"
              required>
          </div>
        </div>
        <div class="login-error" id="loginError" style="display: none;">
          <span>❌</span>
          <span id="loginErrorText">Username atau password salah!</span>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-full" id="btnLogin">🔐 Masuk ke Dashboard</button>
      </form>

      <div class="login-demo">
        <div class="demo-header"><span>💡</span><span>Akun Demo untuk Testing</span></div>
        <div class="demo-creds">
          <div class="demo-item"><span class="demo-label">Username:</span><code class="demo-value">admin</code></div>
          <div class="demo-item"><span class="demo-label">Password:</span><code class="demo-value">admin123</code></div>
        </div>
      </div>

      <a href="/" class="login-back" id="btnBackLanding">← Kembali ke Beranda</a>
    </div>
  </div>

  <script>
    if (localStorage.getItem('gateway_logged_in') === 'true') {
      window.location.href = '/dashboard';
    }
    const VALID_USERS = [
      { username: 'admin', password: 'admin123', name: 'Administrator' },
      { username: 'konsumen', password: 'konsumen123', name: 'Konsumen UMKM' }
    ];
    function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const btn = document.getElementById('btnLogin');
      const errorEl = document.getElementById('loginError');
      errorEl.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> Memverifikasi...';
      setTimeout(() => {
        const user = VALID_USERS.find(u => u.username === username && u.password === password);
        if (user) {
          localStorage.setItem('gateway_logged_in', 'true');
          localStorage.setItem('gateway_user', user.name);
          localStorage.setItem('gateway_username', user.username);
          window.location.href = '/dashboard';
        } else {
          errorEl.style.display = 'flex';
          document.getElementById('loginErrorText').textContent = 'Username atau password salah!';
          btn.disabled = false;
          btn.innerHTML = '🔐 Masuk ke Dashboard';
          const card = document.querySelector('.login-card');
          card.classList.add('shake');
          setTimeout(() => card.classList.remove('shake'), 500);
        }
      }, 800);
    }
  </script>
</body>

</html>
