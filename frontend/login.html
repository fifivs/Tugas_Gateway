<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login ke Dashboard API Gateway UMKM">
  <title>Login — API Gateway</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/landing.css">
</head>

<body>
  <div class="bg-animation">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <div class="login-logo-mark">
          <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        </div>
        <h1 class="login-title">API Gateway</h1>
        <p class="login-subtitle">Masuk ke dashboard untuk mengelola transaksi</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="loginUsername">Username</label>
          <div class="input-icon-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <input type="text" class="form-input form-input-icon" id="loginUsername"
              placeholder="Masukkan username" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <div class="input-icon-wrap">
            <span class="input-icon">
              <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input type="password" class="form-input form-input-icon" id="loginPassword"
              placeholder="Masukkan password" required>
          </div>
        </div>

        <div class="login-error" id="loginError" style="display: none;">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
          <span id="loginErrorText">Username atau password salah!</span>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-full" id="btnLogin">
          <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Masuk ke Dashboard
        </button>
      </form>

      <div class="login-demo">
        <div class="demo-header">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span>Akun Demo untuk Testing</span>
        </div>
        <div class="demo-creds">
          <div class="demo-item">
            <span class="demo-label">Username:</span>
            <code class="demo-value">admin</code>
          </div>
          <div class="demo-item">
            <span class="demo-label">Password:</span>
            <code class="demo-value">admin123</code>
          </div>
        </div>
      </div>

      <a href="/" class="login-back" id="btnBackLanding">← Kembali ke Beranda</a>
    </div>
  </div>

  <script>
    if (localStorage.getItem('gateway_logged_in') === 'true') {
      window.location.href = '/dashboard';
    }

    const VALID_USERS = [
      { username: 'admin', password: 'admin123', name: 'Administrator' },
      { username: 'konsumen', password: 'konsumen123', name: 'Konsumen UMKM' }
    ];

    function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const btn = document.getElementById('btnLogin');
      const errorEl = document.getElementById('loginError');

      errorEl.style.display = 'none';
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div> Memverifikasi...';

      setTimeout(() => {
        const user = VALID_USERS.find(u => u.username === username && u.password === password);
        if (user) {
          localStorage.setItem('gateway_logged_in', 'true');
          localStorage.setItem('gateway_user', user.name);
          localStorage.setItem('gateway_username', user.username);
          window.location.href = '/dashboard';
        } else {
          errorEl.style.display = 'flex';
          document.getElementById('loginErrorText').textContent = 'Username atau password salah!';
          btn.disabled = false;
          btn.innerHTML = `<svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Masuk ke Dashboard`;
          const card = document.querySelector('.login-card');
          card.classList.add('shake');
          setTimeout(() => card.classList.remove('shake'), 500);
        }
      }, 800);
    }
  </script>
</body>

</html>
